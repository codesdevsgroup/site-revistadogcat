<section class="newsletter-section my-5">
  <div class="container">
    <div class="newsletter-box whatsapp-theme" data-aos="zoom-in">
      <div class="row align-items-center">
        <div class="col-lg-6 mb-4 mb-lg-0">
          <span class="badge-newsletter">Exclusivo</span>
          <h2>Fique por Dentro</h2>
          <p class="mb-4">Receba as melhores dicas, novidades e conteúdos exclusivos sobre cuidados com pets diretamente no seu <strong>WhatsApp</strong>.</p>

          <!-- Botão Instagram -->
          <div class="instagram-highlight mt-4">
            <span class="insta-label">Siga também:</span>
            <a href="https://instagram.com/revistadogcat" target="_blank" class="btn-instagram">
              <i class="fab fa-instagram"></i> @revistadogcat
            </a>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="newsletter-card">
            <div class="newsletter-form">
              <label for="phoneInput" class="form-label text-white small mb-2">Cadastre seu WhatsApp:</label>
              <div class="newsletter-input-group">
                <input type="tel" id="phoneInput" placeholder="(11) 99999-9999" #phoneInput>
                <button class="btn btn-primary" (click)="assinarWhatsapp(phoneInput.value); phoneInput.value = ''">
                  <i class="fab fa-whatsapp"></i> Receber
                </button>
              </div>
            </div>
            <small class="text-white-50 mt-2 d-block text-center">Bot exclusivo da Revista Dog & Cat. 🤖</small>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
